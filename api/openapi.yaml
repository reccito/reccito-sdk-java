servers:
- description: Production server
  url: https://api.reccito.com
tags:
- description: Merchant receipt operations
  name: Merchant Receipts
- description: Merchant store management
  name: Merchant Stores
- description: Merchant brand/assets upload and retrieval
  name: Merchant Assets
paths:
  /api/v1/merchant/receipts:
    get:
      description: List receipts with filters and pagination.
      operationId: listReceipts
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
        style: form
      - explode: true
        in: query
        name: store_id
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: search
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: created_at
          title: Sort By
          type: string
        style: form
      - explode: true
        in: query
        name: sort_order
        required: false
        schema:
          default: desc
          title: Sort Order
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptListResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: List Receipts
      tags:
      - Merchant Receipts
      x-accepts:
      - application/json
    post:
      description: |-
        Create a new receipt. Synchronous: the receipt is durably persisted
        before this returns (see ReceiptService.create_receipt_synchronously).
        A retry with the same dedupe_key returns the original receipt with 200,
        not an error (idempotent replay, Stripe-style).
      operationId: createReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptImmediateResponse"
          description: Successful Response
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptImmediateResponse"
          description: "Idempotent replay: a receipt with this organisation + dedupe_key\
            \ already existed. Returns the original receipt unchanged, not an error."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Create Receipt
      tags:
      - Merchant Receipts
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/merchant/receipts/{receipt_id}:
    get:
      description: Get receipt by ID.
      operationId: getReceipt
      parameters:
      - explode: false
        in: path
        name: receipt_id
        required: true
        schema:
          title: Receipt Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantReceiptResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Get Receipt
      tags:
      - Merchant Receipts
      x-accepts:
      - application/json
  /api/v1/merchant/receipts/{receipt_id}/refresh-qr:
    put:
      description: Refresh QR code for a receipt.
      operationId: refreshReceiptQr
      parameters:
      - explode: false
        in: path
        name: receipt_id
        required: true
        schema:
          title: Receipt Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRRefreshResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Refresh Qr Code
      tags:
      - Merchant Receipts
      x-accepts:
      - application/json
  /api/v1/merchant/stores:
    get:
      description: |-
        List all stores for the organisation.

        **Authentication:** Required (Organisation bearer token)

        **Query Parameters:**
        - `skip`: Number of stores to skip (default: 0)
        - `limit`: Number of stores to return (default: 100, max: 1000)
        - `is_active`: Filter by active status (optional)
        - `q`: Search by store name/code/city/email/phone (optional)
      operationId: listStores
      parameters:
      - explode: true
        in: query
        name: skip
        required: false
        schema:
          default: 0
          minimum: 0
          title: Skip
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
        style: form
      - explode: true
        in: query
        name: is_active
        required: false
        schema:
          nullable: true
          type: boolean
        style: form
      - explode: true
        in: query
        name: q
        required: false
        schema:
          maxLength: 120
          minLength: 1
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreListResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: List Stores
      tags:
      - Merchant Stores
      x-accepts:
      - application/json
    post:
      description: |-
        Create a new store for the organisation.

        **Authentication:** Required (Organisation bearer token)
      operationId: createStore
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Create Store
      tags:
      - Merchant Stores
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/merchant/stores/{store_id}:
    get:
      description: |-
        Get a specific store by ID.

        **Authentication:** Required (Organisation bearer token)

        **Path Parameters:**
        - `store_id`: UUID of the store
      operationId: getStore
      parameters:
      - explode: false
        in: path
        name: store_id
        required: true
        schema:
          format: uuid
          title: Store Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Get Store
      tags:
      - Merchant Stores
      x-accepts:
      - application/json
    put:
      description: |-
        Update a store.

        **Authentication:** Required (Organisation bearer token)

        **Path Parameters:**
        - `store_id`: UUID of the store

        **Request Body:** Updated store fields (all optional)
      operationId: updateStore
      parameters:
      - explode: false
        in: path
        name: store_id
        required: true
        schema:
          format: uuid
          title: Store Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Update Store
      tags:
      - Merchant Stores
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/merchant/stores/{store_id}/stats:
    get:
      description: |-
        Get statistics for a store.

        **Authentication:** Required (Organisation bearer token)

        **Path Parameters:**
        - `store_id`: UUID of the store
      operationId: getStoreStats
      parameters:
      - explode: false
        in: path
        name: store_id
        required: true
        schema:
          format: uuid
          title: Store Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreStatsResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Get Store Stats
      tags:
      - Merchant Stores
      x-accepts:
      - application/json
  /api/v1/merchant/assets/upload/logo:
    post:
      description: "Upload a logo file for the organisation. Supported formats: JPEG,\
        \ PNG, WebP, SVG. Max 5MB."
      operationId: uploadOrganisationLogo
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_uploadOrganisationLogo"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Upload organisation logo
      tags:
      - Merchant Assets
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /api/v1/merchant/assets/upload/banner:
    post:
      description: "Upload a banner file for the organisation. Supported formats:\
        \ JPEG, PNG, WebP. Max 5MB."
      operationId: uploadOrganisationBanner
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_uploadOrganisationBanner"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Upload organisation banner
      tags:
      - Merchant Assets
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /api/v1/merchant/assets/upload/store/logo:
    post:
      description: "Upload a logo file for a specific store. Supported formats: JPEG,\
        \ PNG, WebP, SVG. Max 5MB."
      operationId: uploadStoreLogo
      parameters:
      - explode: true
        in: query
        name: store_id
        required: true
        schema:
          title: Store Id
          type: string
        style: form
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_uploadStoreLogo"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: Upload store logo
      tags:
      - Merchant Assets
      x-content-type: multipart/form-data
      x-accepts:
      - application/json
  /api/v1/merchant/assets/list:
    get:
      description: List all branding assets uploaded for the organisation.
      operationId: listOrganisationAssets
      parameters:
      - explode: true
        in: query
        name: asset_type
        required: false
        schema:
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      summary: List organisation assets
      tags:
      - Merchant Assets
      x-accepts:
      - application/json
components:
  schemas:
    ApiResponse:
      description: |-
        Standard API response format.

        All API responses should follow this format for consistency.
        The 'data' field contains the response payload, while 'error'
        is populated when an error occurs. Pagination is included for list endpoints.

        Example:
            Success response:
            {
                "data": {"id": "123", "name": "Logo"},
                "pagination": {"page": 1, "limit": 10, "total": 100, "has_next": true}
            }

            Error response:
            {
                "error": {
                    "code": "VALIDATION_ERROR",
                    "message": "File size exceeds 5MB limit",
                    "details": {"max_size": "5242880"}
                }
            }
      example:
        data:
          logo_url: https://example.com/logo.png
      properties:
        data:
          additionalProperties: true
          description: Response payload data
          nullable: true
          type: object
        error:
          allOf:
          - $ref: "#/components/schemas/ErrorDetail"
          description: Error information
          nullable: true
        pagination:
          allOf:
          - $ref: "#/components/schemas/PaginationInfo"
          description: Pagination information for list responses
          nullable: true
      title: ApiResponse
    Barcode:
      description: |-
        Barcode. Used both as the request shape (ReceiptCreate.barcode) and the
        response shape (see MerchantReceiptResponse/CustomerReceiptDetailResponse/
        ReceiptImmediateResponse.barcode). `code` is required: a Barcode object
        with no code is meaningless.
      properties:
        code:
          maxLength: 100
          minLength: 1
          title: Code
          type: string
        format:
          maxLength: 20
          nullable: true
          type: string
      required:
      - code
      title: Barcode
    Body_uploadOrganisationBanner:
      properties:
        file:
          description: Banner file to upload
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_uploadOrganisationBanner
    Body_uploadOrganisationLogo:
      properties:
        file:
          description: Logo file to upload
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_uploadOrganisationLogo
    Body_uploadStoreLogo:
      properties:
        file:
          description: Store logo file to upload
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_uploadStoreLogo
    ErrorDetail:
      description: Standard error detail response.
      properties:
        code:
          description: Error code identifier
          title: Code
          type: string
        message:
          description: Human-readable error message
          title: Message
          type: string
        details:
          additionalProperties: true
          description: Additional error details
          nullable: true
          type: object
      required:
      - code
      - message
      title: ErrorDetail
    HTTPValidationError:
      example:
        detail:
        - loc:
          - Location_inner
          - Location_inner
          msg: msg
          type: type
          input: ""
          ctx: "{}"
        - loc:
          - Location_inner
          - Location_inner
          msg: msg
          type: type
          input: ""
          ctx: "{}"
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          title: Detail
          type: array
          default: null
      title: HTTPValidationError
    MerchantDetails:
      description: Merchant details parsed from receipt.
      properties:
        name:
          maxLength: 255
          nullable: true
          type: string
        address:
          maxLength: 500
          nullable: true
          type: string
        tax_id:
          maxLength: 100
          nullable: true
          type: string
        contact_phone:
          maxLength: 50
          nullable: true
          type: string
        contact_email:
          maxLength: 255
          nullable: true
          type: string
        website:
          maxLength: 255
          nullable: true
          type: string
      title: MerchantDetails
    MerchantReceiptResponse:
      description: |-
        Receipt response for the merchant audience (dashboard, merchant API keys).

        Excludes customer-upload-pipeline fields (uploaded_file_url, file_size,
        file_type, original_filename, extraction_status/confidence/method/
        completed_at, receipt_source, uploaded_by_customer_id), which are
        always null for merchant-issued receipts and belong to the separate
        customer-audience response shape instead.
      example:
        id: id
        public_token: public_token
        barcode: ""
        merchant_receipt_id: merchant_receipt_id
        merchant_name: merchant_name
        merchant_logo: merchant_logo
        store_id: store_id
        organisation_id: organisation_id
        transaction_date: 2000-01-23T04:56:07.000+00:00
        order_number: order_number
        cashier: cashier
        items:
        - name: name
          quantity: 0
          unit_price: "12.99"
          total_price: "12.99"
          description: description
          sku: sku
          category: category
        - name: name
          quantity: 0
          unit_price: "12.99"
          total_price: "12.99"
          description: description
          sku: sku
          category: category
        subtotal: "12.99"
        tax_amount: "12.99"
        discount_amount: "12.99"
        tip_amount: "12.99"
        total_amount: "12.99"
        currency: currency
        payment_info:
        - method: method
          amount: "12.99"
          card_last_four: card_last_four
          reference: reference
        - method: method
          amount: "12.99"
          card_last_four: card_last_four
          reference: reference
        qr_code_url: qr_code_url
        qr_token: qr_token
        qr_expires_at: 2000-01-23T04:56:07.000+00:00
        receipt_url: receipt_url
        pdf_url: pdf_url
        notes: notes
        return_policy: return_policy
        offers:
        - offers
        - offers
        offer_policies:
        - offer_text: offer_text
          offer_end_date: 2000-01-23T04:56:07.000+00:00
          terms: terms
        - offer_text: offer_text
          offer_end_date: 2000-01-23T04:56:07.000+00:00
          terms: terms
        feedback_url: feedback_url
        loyalty_info: loyalty_info
        merchant_details: ""
        adjustments:
        - scope: receipt
          kind: kind
          label: label
          amount: "12.99"
          item_name: item_name
        - scope: receipt
          kind: kind
          label: label
          amount: "12.99"
          item_name: item_name
        transaction_references:
        - key: key
          value: value
        - key: key
          value: value
        warranties:
        - item_name: item_name
          warranty_terms: warranty_terms
          warranty_end_date: 2000-01-23T04:56:07.000+00:00
          reference: reference
        - item_name: item_name
          warranty_terms: warranty_terms
          warranty_end_date: 2000-01-23T04:56:07.000+00:00
          reference: reference
        insights: ""
        return_insights: ""
        access_count: 6
        last_accessed: 2000-01-23T04:56:07.000+00:00
        status: status
        expires_at: 2000-01-23T04:56:07.000+00:00
        created_at: 2000-01-23T04:56:07.000+00:00
        updated_at: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          title: Id
          type: string
        public_token:
          title: Public Token
          type: string
        barcode:
