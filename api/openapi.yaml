openapi: 3.1.0
info:
  contact:
    email: dev-support@reccito.com
    name: Reccito
    url: https://reccito.com/support
  description: |2

    # Reccito API

    A receipt management platform that enables businesses to create, manage, and
    share digital receipts with customers through QR codes, mobile apps, and web
    interfaces.

    ## Key Features

    ### 🏢 **Multi-Tenant Architecture**
    - Organization and store hierarchy
    - Scoped API access and permissions
    - Isolated data per organization

    ### 📱 **Digital Receipt Management**
    - Create and store digital receipts
    - Generate QR codes for easy customer access
    - Barcode generation for physical receipts
    - Time-limited QR codes for security

    ### 🔐 **Authentication & Security**
    - API key authentication for merchants
    - JWT token authentication for customers
    - Phone-based customer verification with SMS
    - Rate limiting per organization
    - Permission-based access control

    ## Authentication

    ### Merchant Authentication (API Keys)
    ```
    Authorization: Bearer rcp_live_1234567890abcdef
    ```

    Merchants use API keys to access business endpoints. API keys can be scoped to:
    - **Organization level**: Access to all stores within organization
    - **Store level**: Access limited to specific store

    ## Rate Limits

    API requests are rate limited per organization (defaults: 60/minute,
    1,000/hour, 10,000/day; configurable per organization). Responses include
    rate limit headers:
    - `X-RateLimit-Limit-Minute` / `X-RateLimit-Remaining-Minute` / `X-RateLimit-Reset-Minute`
    - `X-RateLimit-Limit-Hour` / `X-RateLimit-Remaining-Hour` / `X-RateLimit-Reset-Hour`

    ## Error Handling

    The API uses standard HTTP status codes. Error responses use one of two
    shapes depending on the endpoint — integrators should handle both:

    - `404` and `500` responses use a structured envelope:
      ```json
      {
          "error": {
              "code": "NOT_FOUND",
              "message": "The requested resource was not found",
              "path": "/api/v1/merchant/receipts/abc"
          }
      }
      ```
    - All other error responses (400, 401, 403, 422, etc.) use FastAPI's default
      `{"detail": ...}` shape, where `detail` may be a plain string or a
      structured object depending on the endpoint. For example:
      ```json
      { "detail": "No active subscription found." }
      ```
      or
      ```json
      { "detail": { "code": "free_tier_quota_exceeded", "message": "..." } }
      ```
      `422` validation errors follow FastAPI's standard `detail: [...]` array
      shape (field, message, error type per invalid field).

    ## Pagination

    List endpoints use offset pagination (`page`/`limit` query parameters):

    ```json
    {
        "receipts": [...],
        "total": 150,
        "page": 1,
        "limit": 25,
        "has_next": true,
        "has_prev": false
    }
    ```

    ## Data Formats

    ### Dates and Times
    Timestamps are ISO 8601. Most are UTC with an explicit offset
    (`2024-01-15T14:30:00+00:00`); a few older fields may omit the offset —
    treat any timestamp without one as UTC.

    ### Currency and Amounts
    Monetary amounts are serialized as **decimal strings** (not numbers), with
    a separate `currency` field. This avoids floating-point precision loss and
    keeps every money field consistent across the API:
    ```json
    {
        "total_amount": "12.99",
        "currency": "GBP"
    }
    ```
    Request bodies still lenient-accept a JSON number for amounts, but the
    published contract and every response are string-only.

    ### ULIDs
    Receipt IDs use ULID format for better performance and sortability:
    ```json
    "01HZXYZ123456789ABCD"
    ```

    ## Support

    - **Support**: [dev-support@reccito.com](mailto:dev-support@reccito.com)
    - **Interactive docs**: [https://api.reccito.com/api/v1/redoc](https://api.reccito.com/api/v1/redoc)



    This document covers Reccito's public integrations API. Admin and
    account-internal operations are not included.
